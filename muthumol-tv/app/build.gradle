plugins { id 'com.android.application' }
def tgId = System.getenv('TG_API_ID') ?: '0'
def tgHash = System.getenv('TG_API_HASH') ?: ''
if (!(tgId ==~ /[0-9]{1,10}/) || Long.parseLong(tgId)>Integer.MAX_VALUE || !(tgHash == '' || tgHash ==~ /[a-fA-F0-9]{32}/)) throw new GradleException('Invalid Telegram build credentials')

android {
 namespace 'com.muthumol.player.dummy'
 compileSdk 35
 defaultConfig { buildConfigField "int", "TG_API_ID", tgId; buildConfigField "String", "TG_API_HASH", "\"${tgHash}\""; applicationId 'com.muthumol.player.dummy'; minSdk 25; targetSdk 35; versionCode 63; versionName '6.0-beta4'; buildConfigField "boolean", "BETA_DIAGNOSTICS", "true"; ndk { abiFilters 'armeabi-v7a' } }
 buildTypes { debug { minifyEnabled false }; release { debuggable false; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging true } }
 signingConfigs { debug { storeFile file(System.getenv('MUTHUMOL_SIGNING_KEY') ?: "${System.getProperty('user.home')}/.android/debug.keystore"); storePassword System.getenv('MUTHUMOL_STORE_PASSWORD') ?: 'android'; keyAlias System.getenv('MUTHUMOL_KEY_ALIAS') ?: 'androiddebugkey'; keyPassword System.getenv('MUTHUMOL_KEY_PASSWORD') ?: 'android' } }
 buildTypes.release.signingConfig signingConfigs.debug
 buildFeatures { buildConfig true }
 testOptions { unitTests.includeAndroidResources = true
 unitTests.all { t ->
   maxParallelForks = 1
   maxHeapSize = '1536m'
   systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
   def proxy = System.getenv('https_proxy')
   if(proxy) { def endpoint = new URI(proxy); systemProperty 'https.proxyHost', endpoint.host; systemProperty 'https.proxyPort', endpoint.port; systemProperty 'http.proxyHost', endpoint.host; systemProperty 'http.proxyPort', endpoint.port }
 }
 }
 // Sideloaded API25 projector build, not a Google Play submission.
 lint { disable 'ExpiredTargetSdkVersion' }
}
dependencies {
 compileOnly 'androidx.annotation:annotation:1.3.0'
 compileOnly 'org.checkerframework:checker-qual:3.13.0'
 implementation 'com.google.zxing:core:3.5.3'
 implementation files('libs/tdlib-classes.jar')
 implementation 'androidx.media3:media3-exoplayer:1.4.1'
 implementation 'androidx.media3:media3-ui:1.4.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
