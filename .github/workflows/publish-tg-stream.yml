name: Publish TG stream update
on:
  push:
    branches: [tg-stream-updates]
    paths: ['.github/workflows/publish-tg-stream.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish signed APK
        env:
          APK_URL: https://sdmntprwestus3.oaiusercontent.com/files/00000000-18e4-81fd-b843-665e585c0918/raw?se=2026-10-29T17%3A54%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=1e8391ec-9739-4d84-8fdf-76e8d329ec8d&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T15%3A21%3A52Z&ske=2026-10-30T15%3A21%3A52Z&sks=b&skv=2026-02-06&sig=ctq5JKpOEWlZ3lfzgMsT3AoRXdRwr4YSuhg9FSM87DQ%3D
        run: |
          mkdir -p apks
          curl --fail -L "$APK_URL" -o apks/TG_stream_V5.4.apk
          echo '8020c814197bb3dee8ffefe52c51ca4b22fecd42f4f64e24d4fce6313497cc56  apks/TG_stream_V5.4.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 25 --print-certs apks/TG_stream_V5.4.apk > /tmp/certificate.txt
          grep -q '26e7b63fcdd306fe3f52a0172a3180160c0aee359a6c00f933ded41e8c0b8318' /tmp/certificate.txt
          cat > latest.json <<'JSON'
          {"versionCode":57,"versionName":"5.4","url":"https://raw.githubusercontent.com/rinsanak/TelePlay_gpt_patched/tg-stream-updates/apks/TG_stream_V5.4.apk","sha256":"8020c814197bb3dee8ffefe52c51ca4b22fecd42f4f64e24d4fce6313497cc56","notes":"Glass Home with translucent panels, controls and bottom poster shelf. Selected artwork creates a full-width soft background, prepared once in the background. Smooth focus and cover transitions, with no Home video preload."}
          JSON
          git config user.name "TG stream releases"
          git config user.email "57000179+rinsanak@users.noreply.github.com"
          git add apks/TG_stream_V5.4.apk latest.json
          git commit -m "Publish signed TG stream 5.4 and update feed"
          git push
