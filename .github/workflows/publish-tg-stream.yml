name: Publish TG stream update
on:
  push:
    branches: [tg-stream-updates]
    paths: ['.github/workflows/publish-tg-stream.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish signed APK
        env:
          APK_URL: https://sdmntprcentralindia.oaiusercontent.com/files/00000000-43d4-8208-a044-99f3f186eb0e/raw?se=2026-10-27T21%3A42%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=a0c10829-0b1a-4d6f-8ad9-02671bcccf41&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T12%3A05%3A14Z&ske=2026-10-28T12%3A05%3A14Z&sks=b&skv=2026-02-06&sig=AgMlmwfIZOdtHrDxfSdIXqQDHio22WePFpE/C5nrVTQ%3D
        run: |
          mkdir -p apks
          curl --fail -L "$APK_URL" -o apks/TG_stream_V5.0.apk
          echo '00239fb9a3d97a02e72c99eeafe8ec5db18f244b0611e6b95e5ec556599c013f  apks/TG_stream_V5.0.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 25 --print-certs apks/TG_stream_V5.0.apk > /tmp/certificate.txt
          grep -q '26e7b63fcdd306fe3f52a0172a3180160c0aee359a6c00f933ded41e8c0b8318' /tmp/certificate.txt
          cat > latest.json <<'JSON'
          {"versionCode":53,"versionName":"5.0","url":"https://raw.githubusercontent.com/rinsanak/TelePlay_gpt_patched/tg-stream-updates/apks/TG_stream_V5.0.apk","sha256":"00239fb9a3d97a02e72c99eeafe8ec5db18f244b0611e6b95e5ec556599c013f","notes":"Cinema Home with cached artwork or title fallback, Continue progress and remaining time. Side panels, focus labels, seek feedback and live subtitle preview."}
          JSON
          git config user.name "TG stream releases"
          git config user.email "57000179+rinsanak@users.noreply.github.com"
          git add apks/TG_stream_V5.0.apk latest.json
          git commit -m "Publish signed TG stream 5.0 and update feed"
          git push
