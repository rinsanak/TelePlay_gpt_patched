name: Publish TG stream update
on:
  push:
    branches: [tg-stream-updates]
    paths: ['.github/workflows/publish-tg-stream.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish signed APK
        env:
          APK_URL: https://sdmntpreastus2.oaiusercontent.com/files/00000000-a238-81f6-86b1-55950c42a7ce/raw?se=2026-10-29T18%3A23%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=e8b4ca73-317b-461b-8a1d-6a74bb44fb30&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T15%3A30%3A41Z&ske=2026-10-30T15%3A30%3A41Z&sks=b&skv=2026-02-06&sig=eeRgL/kNsEgr2czVsbfEajSfFjmuexqgYIhnrq0sDVg%3D
        run: |
          mkdir -p apks
          curl --fail -L "$APK_URL" -o apks/TG_stream_V5.5.apk
          echo 'af3b98dcf2403ec06bb77fa988f6a032da32392186b4ac537afe02a713bad2df  apks/TG_stream_V5.5.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 25 --print-certs apks/TG_stream_V5.5.apk > /tmp/certificate.txt
          grep -q '26e7b63fcdd306fe3f52a0172a3180160c0aee359a6c00f933ded41e8c0b8318' /tmp/certificate.txt
          cat > latest.json <<'JSON'
          {"versionCode":58,"versionName":"5.5","url":"https://raw.githubusercontent.com/rinsanak/TelePlay_gpt_patched/tg-stream-updates/apks/TG_stream_V5.5.apk","sha256":"af3b98dcf2403ec06bb77fa988f6a032da32392186b4ac537afe02a713bad2df","notes":"Selected-movie preload restored. Faster bulk PCM boost and multichannel stereo processing, larger audio reserve and steadier rebuffer recovery. Held media seek keys no longer flood the player. Glass UI retained; added first-audio and clock-jump diagnostics."}
          JSON
          git config user.name "TG stream releases"
          git config user.email "57000179+rinsanak@users.noreply.github.com"
          git add apks/TG_stream_V5.5.apk latest.json
          git commit -m "Publish signed TG stream 5.5 and update feed"
          git push
