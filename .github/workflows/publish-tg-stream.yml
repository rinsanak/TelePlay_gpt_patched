name: Publish TG stream update
on:
  push:
    branches: [tg-stream-updates]
    paths: ['.github/workflows/publish-tg-stream.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish signed APK
        env:
          APK_URL: https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-e288-820a-b745-e3b10a8d27a3/raw?se=2026-10-29T17%3A00%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=3a9c9ee6-848b-4248-aec6-ffe2e6f1275b&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T15%3A11%3A24Z&ske=2026-10-30T15%3A11%3A24Z&sks=b&skv=2026-02-06&sig=SUXfC4yNcCH9hl3QNPuc3WW/LN7ABS4DY7aeSlpzYO0%3D
        run: |
          mkdir -p apks
          curl --fail -L "$APK_URL" -o apks/TG_stream_V5.2.apk
          echo 'bf811ce7e54ed743d5c8685df611f2b5beec79b55805d74ee8a5eaa0371d3433  apks/TG_stream_V5.2.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 25 --print-certs apks/TG_stream_V5.2.apk > /tmp/certificate.txt
          grep -q '26e7b63fcdd306fe3f52a0172a3180160c0aee359a6c00f933ded41e8c0b8318' /tmp/certificate.txt
          cat > latest.json <<'JSON'
          {"versionCode":55,"versionName":"5.2","url":"https://raw.githubusercontent.com/rinsanak/TelePlay_gpt_patched/tg-stream-updates/apks/TG_stream_V5.2.apk","sha256":"bf811ce7e54ed743d5c8685df611f2b5beec79b55805d74ee8a5eaa0371d3433","notes":"Cinematic Home with online movie posters and season/episode artwork, cached thumbnails and clean titles. Home video preload is off. Update checks have a GitHub API fallback and show installed/server versions."}
          JSON
          git config user.name "TG stream releases"
          git config user.email "57000179+rinsanak@users.noreply.github.com"
          git add apks/TG_stream_V5.2.apk latest.json
          git commit -m "Publish signed TG stream 5.2 and update feed"
          git push
