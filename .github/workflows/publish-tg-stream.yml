name: Publish TG stream update
on:
  push:
    branches: [tg-stream-updates]
    paths: ['.github/workflows/publish-tg-stream.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish signed APK
        env:
          APK_URL: https://sdmntprcentralindia.oaiusercontent.com/files/00000000-4e58-8208-a2ba-65ac00691713/raw?se=2026-10-29T19%3A28%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=ae54a043-0b97-42a4-b1c5-f37885e52a3d&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T15%3A15%3A24Z&ske=2026-10-30T15%3A15%3A24Z&sks=b&skv=2026-02-06&sig=a7rBGSKsIkLG%2BALVmoRq0ry7QcHZkVZh4tAujVwLOXc%3D
        run: |
          mkdir -p apks
          curl --fail -L "$APK_URL" -o apks/TG_stream_V5.6.apk
          echo 'ebba6ef4081e98f5cf56d5e83f41bb345d7b51a0757c28f8c5f13448ab7d605a  apks/TG_stream_V5.6.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 25 --print-certs apks/TG_stream_V5.6.apk > /tmp/certificate.txt
          grep -q '26e7b63fcdd306fe3f52a0172a3180160c0aee359a6c00f933ded41e8c0b8318' /tmp/certificate.txt
          cat > latest.json <<'JSON'
          {"versionCode":59,"versionName":"5.6","url":"https://raw.githubusercontent.com/rinsanak/TelePlay_gpt_patched/tg-stream-updates/apks/TG_stream_V5.6.apk","sha256":"ebba6ef4081e98f5cf56d5e83f41bb345d7b51a0757c28f8c5f13448ab7d605a","notes":"Optimized non-debuggable Release build. Restored V5.1 preload continuity during Home/Player transitions. Android 12+ async decoding default restored with codec error fallback preserved. Glass UI and bulk audio processing retained."}
          JSON
          git config user.name "TG stream releases"
          git config user.email "57000179+rinsanak@users.noreply.github.com"
          git add apks/TG_stream_V5.6.apk latest.json
          git commit -m "Publish signed TG stream 5.6 and update feed"
          git push
