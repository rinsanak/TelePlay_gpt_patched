name: Build and publish Muthumol TV update
on:
  push:
    branches: [main]
    paths: ['muthumol-tv/**', '.github/workflows/muthumol-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: muthumol-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      MUTHUMOL_STORE_PASSWORD: ${{ secrets.MUTHUMOL_STORE_PASSWORD }}
      MUTHUMOL_KEY_PASSWORD: ${{ secrets.MUTHUMOL_KEY_PASSWORD }}
      MUTHUMOL_KEY_ALIAS: ${{ vars.MUTHUMOL_KEY_ALIAS || 'muthumol-release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check signing prerequisite
        env:
          SIGNING_KEY: ${{ secrets.MUTHUMOL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo '::error::Configure persistent signing secrets before publishing an APK.'
            exit 1
          fi
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ] || [ -z "$MUTHUMOL_STORE_PASSWORD" ] || [ -z "$MUTHUMOL_KEY_PASSWORD" ]; then
            echo '::error::Configure TG_API_ID, TG_API_HASH and the signing passwords in Actions secrets. End users will only see phone/QR login.'
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/muthumol.keystore"
          echo "MUTHUMOL_SIGNING_KEY=$RUNNER_TEMP/muthumol.keystore" >> "$GITHUB_ENV"
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Test, lint and build signed release
        working-directory: muthumol-tv
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Stage verified update
        run: |
          set -euo pipefail
          python3 muthumol-tv/tools/publish-update.py stage "$RUNNER_TEMP/update"
          git archive --format=zip --output="$RUNNER_TEMP/update/source.zip" HEAD muthumol-tv .github/workflows/muthumol-release.yml RELEASE_UPDATES.md
      - name: Retain release files and test reports
        uses: actions/upload-artifact@v4
        with:
          name: Muthumol-TV-update
          path: |
            ${{ runner.temp }}/update/
            muthumol-tv/app/build/reports/
            muthumol-tv/app/build/test-results/
      - name: Publish APK, source and updater manifest together
        run: |
          set -euo pipefail
          cp muthumol-tv/tools/publish-update.py "$RUNNER_TEMP/publish-update.py"
          git fetch origin tg-stream-updates:refs/remotes/origin/tg-stream-updates
          git switch --create release-feed --track origin/tg-stream-updates
          python3 "$RUNNER_TEMP/publish-update.py" publish "$RUNNER_TEMP/update"
          git config user.name 'Muthumol TV releases'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apks sources latest.json
          git commit -m 'Publish verified Muthumol TV update'
          git push origin HEAD:tg-stream-updates
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/muthumol.keystore"
