name: Build and publish TG stream update
on:
  push:
    branches: [main]
    paths: ['muthumol-tv/**', '.github/workflows/muthumol-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: muthumol-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      MUTHUMOL_STORE_PASSWORD: ${{ secrets.MUTHUMOL_STORE_PASSWORD }}
      MUTHUMOL_KEY_PASSWORD: ${{ secrets.MUTHUMOL_KEY_PASSWORD }}
      MUTHUMOL_KEY_ALIAS: androiddebugkey
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Telegram configuration
        run: |
          python3 - <<'CHECK'
          import os, re
          assert re.fullmatch(r'[1-9][0-9]*', os.getenv('TG_API_ID', '')), 'TG_API_ID missing or invalid'
          assert re.fullmatch(r'[a-fA-F0-9]{32}', os.getenv('TG_API_HASH', '')), 'TG_API_HASH missing or invalid'
          print('Telegram build configuration present')
          CHECK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Validate source before signing
        working-directory: muthumol-tv
        run: bash gradlew --no-daemon --max-workers=2 -I tools/unsigned-release.gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TG-stream-validation
          path: |
            muthumol-tv/app/build/reports/
            muthumol-tv/app/build/test-results/
      - name: Retain configured APK for original-key signing
        uses: actions/upload-artifact@v4
        with:
          name: TG-stream-original-key-signing-input
          path: muthumol-tv/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Select original signing route
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.MUTHUMOL_KEYSTORE_BASE64 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f muthumol-tv/release-candidate.json ]; then
            python3 - <<'DOWNLOAD'
          import os, re, json, base64, hashlib, urllib.request
          from pathlib import Path
          candidate = json.loads(Path('muthumol-tv/release-candidate.json').read_text())
          blob = candidate['blob_sha']
          digest = candidate['sha256']
          assert re.fullmatch(r'[a-f0-9]{40}', blob), 'Invalid candidate blob'
          assert re.fullmatch(r'[a-f0-9]{64}', digest), 'Invalid APK checksum'
          url = 'https://api.github.com/repos/rinsanak/TelePlay_gpt_patched/git/blobs/' + blob
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=120) as response:
              record = json.load(response)
          assert record['encoding'] == 'base64', 'Unexpected blob encoding'
          data = base64.b64decode(record['content'])
          assert hashlib.sha256(data).hexdigest() == digest, 'Signed APK checksum mismatch'
          Path('muthumol-tv/app/build/outputs/apk/release/app-release.apk').write_bytes(data)
          DOWNLOAD
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'external=true' >> "$GITHUB_OUTPUT"
          elif [ -n "$SIGNING_KEY" ] && [ -n "$MUTHUMOL_STORE_PASSWORD" ] && [ -n "$MUTHUMOL_KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/muthumol.keystore"
            echo "MUTHUMOL_SIGNING_KEY=$RUNNER_TEMP/muthumol.keystore" >> "$GITHUB_ENV"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Configured unsigned APK is ready for signing with the recovered original key. The feed has not changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build signed release
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.external != 'true'
        working-directory: muthumol-tv
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleRelease
      - name: Stage verified update
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 muthumol-tv/tools/publish-update.py stage "$RUNNER_TEMP/update"
          git archive --format=zip --output="$RUNNER_TEMP/update/source.zip" HEAD muthumol-tv .github/workflows/muthumol-release.yml RELEASE_UPDATES.md
      - name: Retain release files and test reports
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TG-stream-update
          path: |
            ${{ runner.temp }}/update/
            muthumol-tv/app/build/reports/
            muthumol-tv/app/build/test-results/
      - name: Publish APK, source and updater manifest together
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cp muthumol-tv/tools/publish-update.py "$RUNNER_TEMP/publish-update.py"
          git fetch origin tg-stream-updates:refs/remotes/origin/tg-stream-updates
          git switch --create release-feed --track origin/tg-stream-updates
          python3 "$RUNNER_TEMP/publish-update.py" publish "$RUNNER_TEMP/update"
          git config user.name 'Muthumol TV releases'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apks sources latest.json
          git commit -m 'Publish verified Muthumol TV update'
          git push origin HEAD:tg-stream-updates
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/muthumol.keystore"

